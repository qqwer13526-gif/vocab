<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>截图/查看用：把应用装进固定尺寸的 iframe</title>
<style>
  html, body { margin: 0; background: #fff; }
  /* 固定在左上角、尺寸由参数决定：这样截图裁 (0,0,w,h) 就是应用本身的画面。
     不靠 --window-size 定视口：Chromium 的窗口有最小宽度，会把手机尺寸顶掉。 */
  iframe { position: fixed; left: 0; top: 0; border: 0; }
</style>
</head>
<body>
<!-- 拖住 load 事件：等应用把界面渲染完再放行，这样截到的图是渲染好的 -->
<img id="hold" src="../__slow?ms=60000" alt="" style="position:fixed;left:-9999px;width:1px;height:1px">
<iframe id="app" src="../index.html" title="应用"></iframe>
<script>
  const q = new URLSearchParams(location.search);
  const w = parseInt(q.get('w') || '390', 10);
  const h = parseInt(q.get('h') || '844', 10);
  const theme = q.get('theme') || '';
  const frame = document.getElementById('app');
  frame.style.width = w + 'px';
  frame.style.height = h + 'px';
  if (q.get('hash')) frame.src = '../index.html' + q.get('hash');

  const release = () => { document.getElementById('hold').src = 'data:image/gif;base64,R0lGODlhAQABAAAAACw='; };

  // 系统深浅色在无头浏览器里不可靠，截图时要能钉住。
  // 早先这里是写死一套 token 覆盖应用（那时候调色板小），后来应用改成 @media (prefers-color-scheme: dark)，
  // 写死的副本就跟真实主题对不上了 —— 截出来的图颜色是假的。现在改成：
  //   light → 什么都不做（应用默认就是浅色）
  //   dark  → 把应用样式表里 `prefers-color-scheme: dark` 那段**拆开**塞进 iframe（不是另抄一份，永不漂移）
  // 需要看"提高对比度"时同理（theme=contrast / contrast-dark）。
  function unwrapMedia(doc, needles) {
    const css = [];
    for (const sheet of doc.styleSheets) {
      let rules;
      try { rules = sheet.cssRules; } catch (e) { continue; }
      for (const rule of rules) {
        if (rule.type !== CSSRule.MEDIA_RULE) continue;
        const cond = rule.conditionText || rule.media.mediaText || '';
        if (!needles.every((n) => cond.includes(n))) continue;
        for (const inner of rule.cssRules) css.push(inner.cssText);
      }
    }
    if (!css.length) return false;
    const s = doc.createElement('style');
    s.dataset.shotTheme = '1';
    s.textContent = css.join('\n');
    doc.head.append(s);
    return true;
  }

  /** 反过来：把 `prefers-color-scheme: dark` 那段关掉（无头浏览器默认就偏好深色，不关掉截不出浅色） */
  function muteMedia(doc, needle) {
    let n = 0;
    for (const sheet of doc.styleSheets) {
      let rules;
      try { rules = sheet.cssRules; } catch (e) { continue; }
      for (const rule of rules) {
        if (rule.type !== CSSRule.MEDIA_RULE) continue;
        const cond = rule.conditionText || rule.media.mediaText || '';
        if (!cond.includes(needle)) continue;
        rule.media.mediaText = 'not all';
        n++;
      }
    }
    return n > 0;
  }

  frame.addEventListener('load', async () => {
    const t0 = Date.now();
    const waitSel = q.get('wait') || '';
    for (;;) {
      let ready = false;
      try {
        const d = frame.contentDocument;
        ready = !!(d && d.body && d.body.dataset.ready === '1' && (!waitSel || d.querySelector(waitSel)));
      } catch (e) { /* 还没好 */ }
      if (ready || Date.now() - t0 > 20000) break;
      await new Promise((r) => setTimeout(r, 50));
    }
    // 需要看图的时候顺手把内容喂进去（例如导入页要看粘好之后的界面）
    const pasteUrl = q.get('paste');
    if (pasteUrl) {
      try {
        const d = frame.contentDocument;
        const text = await (await fetch(pasteUrl)).text();
        const box = d.querySelector('[data-testid="import-text"]');
        if (box) {
          box.value = text;
          box.dispatchEvent(new Event('input', { bubbles: true }));
          await new Promise((r) => setTimeout(r, 300));
        }
      } catch (e) { /* 忽略 */ }
    }
    // 需要看"答完之后的界面"（揭晓块、反馈、按钮态）时：answer=xxx 会替你在输入框里打字并回车
    if (q.get('answer') != null) {
      try {
        const d = frame.contentDocument;
        const box = d.querySelector('[data-testid="practice-input"]');
        if (box && !box.hidden) {
          box.value = q.get('answer');
          box.dispatchEvent(new Event('input', { bubbles: true }));
          box.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
          await new Promise((r) => setTimeout(r, 300));
        }
      } catch (e) { /* 忽略 */ }
    }
    if (theme) {
      try {
        const d = frame.contentDocument;
        const contrast = theme.startsWith('contrast');
        const dark = theme.endsWith('dark') || theme === 'dark';
        if (dark) unwrapMedia(d, [...(contrast ? ['prefers-contrast: more'] : []), 'prefers-color-scheme: dark']);
        else muteMedia(d, 'prefers-color-scheme: dark');
      } catch (e) { /* 忽略 */ }
    }
    await new Promise((r) => setTimeout(r, 350)); // 让过渡动画落定
    release();
  });
</script>
</body>
</html>
