<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>词条界面 · 界面测试</title>
</head>
<body>
<pre id="result">{"stage":"running"}</pre>
<script src="trap.js"></script>
<script type="module">
/* 词条界面（任务 9）：列表、搜索、编辑、换库、重置进度、删除。
   跑法：python tool/browser_test.py tests/browser/ui-word.test.html
*/
import { click, eq, holdLoad, ok, openApp, report, type, wait, waitFor } from './harness.js';

const release = holdLoad();
const NOW = Date.now();
let db = null;

const q = (frame, sel) => frame.contentDocument.querySelector(sel);
const qa = (frame, sel) => [...frame.contentDocument.querySelectorAll(sel)];
const t = (frame, sel) => {
  const n = q(frame, sel);
  return n ? n.textContent.replace(/\s+/g, ' ').trim() : '';
};

const WORDS = [
  ['absorb', 'v.', ['take in or soak up吸收', '使专心'], 'əbˈsɔːb'],
  ['acceptable', 'adj.', ['可接受的，合意的'], 'əkˈseptəbl'],
  ['access', 'v./n.', ['存取（信息）', '接近'], 'ˈækses'],
  ['accomplish', 'v.', ['完成', '实现'], 'əˈkʌmplɪʃ']
];

async function seed() {
  await db.wipeAll();
  const a = 'lib-4ji';
  const b = 'lib-kaoyan';
  await db.put('libs', { id: a, name: '四级 Test 1', color: '#3b5bff', order: 0, updatedAt: NOW });
  await db.put('libs', { id: b, name: '考研', color: '#ff9f0a', order: 1, updatedAt: NOW });
  let i = 0;
  for (const [term, pos, meanings, phonetic] of WORDS) {
    const id = `w-${term}`;
    await db.put('words', { id, term, termNorm: term, phonetic, pos, meanings, example: '', note: '', createdAt: NOW + i++, updatedAt: NOW });
    await db.put('links', { id: `${id}|${a}`, wordId: id, libId: a, addedAt: NOW, updatedAt: NOW });
  }
  // 给 access 一点学习进度
  await db.put('prog', { wordId: 'w-access', box: 2, dueAt: NOW + 86400000, streak: 1, lapses: 0, lastDir: 'en2zh', updatedAt: NOW });
  return { a, b };
}

try {
  db = await import('../../src/db.js');
  const { a: libA, b: libB } = await seed();

  // ---------------- 1. 列表 ----------------
  let frame = await openApp({ hash: `#/word?lib=${libA}`, sel: '[data-testid="word-row"]' });
  let rows = qa(frame, '[data-testid="word-row"]');
  eq('列出这个词库里的 4 个词', rows.length, 4);
  ok('第一行是 absorb', rows[0].textContent.includes('absorb'), rows[0].textContent.replace(/\s+/g, ' '));
  ok('行里带释义摘要', rows[0].textContent.includes('吸收'), rows[0].textContent.replace(/\s+/g, ' '));
  const accessRow = rows.find((r) => r.dataset.id === 'w-access');
  eq('有学习进度的词显示盒子号', accessRow.querySelector('[data-testid="box-pill"]').dataset.box, '2');
  const absorbRow = rows.find((r) => r.dataset.id === 'w-absorb');
  eq('没学过的词显示"新"', absorbRow.querySelector('[data-testid="box-pill"]').dataset.box, '0');

  // ---------------- 2. 搜索 ----------------
  type(q(frame, '[data-testid="word-search"]'), 'acc');
  await waitFor(() => qa(frame, '[data-testid="word-row"]').length === 3, { label: '搜到 3 个' });
  ok('搜索能筛出 3 个 acc 开头的词', true);
  type(q(frame, '[data-testid="word-search"]'), 'zzz');
  await waitFor(() => !!q(frame, '[data-testid="word-empty"]'), { label: '出现空提示' });
  ok('搜不到时给提示', t(frame, '[data-testid="word-empty"]').includes('没有'), t(frame, '[data-testid="word-empty"]'));
  type(q(frame, '[data-testid="word-search"]'), '');
  await waitFor(() => qa(frame, '[data-testid="word-row"]').length === 4, { label: '清空搜索后恢复 4 条' });

  // ---------------- 3. 打开词条编辑 ----------------
  click(qa(frame, '[data-testid="word-row"]').find((r) => r.dataset.id === 'w-absorb'));
  await waitFor(() => q(frame, '[data-testid="word-edit"]'), { label: '进入编辑' });
  ok('URL 带上词条 id', frame.contentWindow.location.hash.includes('id=w-absorb'), frame.contentWindow.location.hash);
  eq('释义框里一条一行', q(frame, '[data-testid="word-meanings"]').value, 'take in or soak up吸收\n使专心');
  eq('音标回填', q(frame, '[data-testid="word-phonetic"]').value, 'əbˈsɔːb');
  ok('有词库勾选', qa(frame, '[data-testid="word-lib-check"]').length === 2);
  eq('当前所属词库已勾上', qa(frame, '[data-testid="word-lib-check"]').filter((c) => c.checked).map((c) => c.value), [libA]);

  // ---------------- 4. 改释义并保存 ----------------
  const before = (await db.get('words', 'w-absorb')).updatedAt;
  type(q(frame, '[data-testid="word-meanings"]'), '吸收\n使专心\n全神贯注');
  type(q(frame, '[data-testid="word-note"]'), '名词形式 absorption');
  click(q(frame, '[data-testid="btn-save"]'));
  await waitFor(async () => (await db.get('words', 'w-absorb')).meanings.length === 3, { label: '释义写库' });
  const saved = await db.get('words', 'w-absorb');
  eq('释义按行存', saved.meanings, ['吸收', '使专心', '全神贯注']);
  eq('笔记也存了', saved.note, '名词形式 absorption');
  ok('updatedAt 被刷新', saved.updatedAt > before, `${before} → ${saved.updatedAt}`);

  // ---------------- 5. 换库 ----------------
  const checks = qa(frame, '[data-testid="word-lib-check"]');
  click(checks[0]); // 取消原库
  click(checks[1]); // 勾上新库
  click(q(frame, '[data-testid="btn-save"]'));
  await waitFor(async () => {
    const ls = await db.byIndex('links', 'by_word', 'w-absorb');
    return ls.some((l) => l.libId === libB && !l.deleted);
  }, { label: '新库归属写库' });
  const links = await db.byIndex('links', 'by_word', 'w-absorb');
  const oldLink = links.find((l) => l.libId === libA);
  ok('取消的库被软删除（记录留着）', oldLink && oldLink.deleted === true, JSON.stringify(oldLink));
  ok('新库归属已建立', links.some((l) => l.libId === libB && !l.deleted));
  eq('词本身没被删', (await db.get('words', 'w-absorb')).deleted, undefined);

  // 换回去，别影响后面的用例
  click(qa(frame, '[data-testid="word-lib-check"]')[0]);
  click(qa(frame, '[data-testid="word-lib-check"]')[1]);
  click(q(frame, '[data-testid="btn-save"]'));
  await waitFor(async () => (await db.byIndex('links', 'by_word', 'w-absorb')).some((l) => l.libId === libA && !l.deleted), { label: '换回原库' });

  // ---------------- 6. 重置进度（要二次确认）----------------
  frame.contentWindow.location.hash = '#/word?id=w-access&lib=' + libA;
  await waitFor(() => q(frame, '[data-testid="word-edit"]') && t(frame, '[data-testid="word-term"]') === 'access', { label: '打开 access' });
  click(q(frame, '[data-testid="btn-reset-progress"]'));
  await wait(120);
  ok('重置进度第一次点只武装（不执行）', (await db.get('prog', 'w-access')).box !== 1, `box=${(await db.get('prog', 'w-access')).box}`);
  ok('按钮文字变成确认', t(frame, '[data-testid="btn-reset-progress"]').includes('确认'), t(frame, '[data-testid="btn-reset-progress"]'));
  click(q(frame, '[data-testid="btn-reset-progress"]'));
  await waitFor(async () => (await db.get('prog', 'w-access')).box === 1, { label: '进度被重置' });
  const p = await db.get('prog', 'w-access');
  eq('重置后回到盒子 1、连对清零', [p.box, p.streak, p.lapses], [1, 0, 0]);
  ok('重置后马上可以再练', p.dueAt <= Date.now() + 1000, String(p.dueAt - Date.now()));

  // ---------------- 7. 删除（要二次确认）----------------
  click(q(frame, '[data-testid="btn-delete"]'));
  await wait(120);
  ok('删除第一次点只武装（数据还在）', (await db.get('words', 'w-access')).deleted !== true, '一次点击就删了');
  eq('武装状态标在按钮上', q(frame, '[data-testid="btn-delete"]').dataset.armed, '1');
  click(q(frame, '[data-testid="btn-delete"]'));
  await waitFor(async () => (await db.get('words', 'w-access')).deleted === true, { label: '软删除写库' });
  ok('删除是软删除（记录还在）', !!(await db.get('words', 'w-access')));

  // 删除后界面跳走了，就地提示看不见 → 必须有一条提示条
  const toast = frame.contentDocument.querySelector('[data-testid="toast"]');
  ok('删除后有提示条说了一声', !!toast && toast.textContent.includes('已删除'), toast ? toast.textContent : '没有提示条');
  ok('提示条是"成功"样式', toast && toast.dataset.kind === 'ok', toast ? toast.dataset.kind : '');
  await waitFor(() => frame.contentWindow.location.hash.startsWith('#/word') && !q(frame, '[data-testid="word-edit"]'), { label: '回到列表' });
  const after = qa(frame, '[data-testid="word-row"]');
  eq('列表里少了一个词', after.length, 3);
  ok('删掉的词不在列表里', !after.some((r) => r.dataset.id === 'w-access'));

  // ---------------- 8. 二次确认组件本身（超时 / 点别处 / 连点两次）----------------
  const cf = await import('../../src/confirm.js');
  const probe = document.createElement('button');
  probe.textContent = '删';
  document.body.append(probe);
  let fired = 0;
  cf.confirmThen(probe, () => fired++, { label: '确认？', timeout: 120 });
  probe.click();
  eq('武装后文字变了', probe.textContent, '确认？');
  await wait(200);
  eq('超时后自动解除（不会一直挂着）', probe.textContent, '删');
  probe.click();
  await wait(20);
  document.body.click();
  await wait(20);
  eq('点别处解除', probe.textContent, '删');
  probe.click();
  await wait(20);
  probe.click();
  eq('连点两次才真的执行', fired, 1);
  probe.remove();

  // ---------------- 9. 熟记 / 生疏：徽章与筛选 ----------------
  await db.wipeAll();
  const libX = 'lib-lvl';
  await db.put('libs', { id: libX, name: '分级测试', color: '#34c759', order: 0, updatedAt: NOW });
  const lvlWords = [
    ['alpha', 'known'],
    ['beta', 'unfamiliar'],
    ['gamma', null],
    ['delta', null]
  ];
  let li = 0;
  for (const [term, level] of lvlWords) {
    const id = `w-${term}`;
    await db.put('words', { id, term, termNorm: term, phonetic: '', pos: '', meanings: [term + '的意思'], example: '', note: '', createdAt: NOW + li++, updatedAt: NOW });
    await db.put('links', { id: `${id}|${libX}`, wordId: id, libId: libX, addedAt: NOW, updatedAt: NOW });
    if (level) {
      await db.put('prog', {
        wordId: id, box: level === 'known' ? 6 : 1,
        dueAt: level === 'known' ? NOW + 60 * 86400000 : NOW,
        streak: 0, lapses: 0, lastDir: null, level, levelAt: NOW, updatedAt: NOW
      });
    }
  }
  frame = await openApp({ hash: `#/word?lib=${libX}`, sel: '[data-testid="word-row"]' });
  const rowAlpha = qa(frame, '[data-testid="word-row"]').find((r) => r.dataset.id === 'w-alpha');
  const rowGamma = qa(frame, '[data-testid="word-row"]').find((r) => r.dataset.id === 'w-gamma');
  eq('标了熟记的词显示徽章', rowAlpha.querySelector('[data-testid="level-pill"]').dataset.level, 'known');
  eq('徽章文字是中文', rowAlpha.querySelector('[data-testid="level-pill"]').textContent.trim(), '熟记');
  ok('没标级的词不显示徽章', !rowGamma.querySelector('[data-testid="level-pill"]'));
  const rowBeta = qa(frame, '[data-testid="word-row"]').find((r) => r.dataset.id === 'w-beta');
  eq('生疏的词显示生疏徽章', rowBeta.querySelector('[data-testid="level-pill"]').dataset.level, 'unfamiliar');

  const chipText = t(frame, '[data-testid="level-filter"]');
  ok('筛选条带数量：熟记 1 / 生疏 1 / 未标 2', /熟记\s*1/.test(chipText) && /生疏\s*1/.test(chipText) && /未标\s*2/.test(chipText), chipText);
  const chips = qa(frame, '[data-testid="level-filter"] .chip');
  eq('筛选条有 4 个选项', chips.length, 4);

  click(chips.find((c) => c.dataset.level === 'known'));
  await waitFor(() => qa(frame, '[data-testid="word-row"]').length === 1, { label: '筛出熟记' });
  eq('点"熟记"只剩 1 个词', qa(frame, '[data-testid="word-row"]')[0].dataset.id, 'w-alpha');
  ok('筛选状态进了 URL', frame.contentWindow.location.hash.includes('level=known'), frame.contentWindow.location.hash);

  click(qa(frame, '[data-testid="level-filter"] .chip').find((c) => c.dataset.level === 'unfamiliar'));
  await waitFor(() => qa(frame, '[data-testid="word-row"]').length === 1, { label: '筛出生疏' });
  eq('点"生疏"只剩 1 个词', qa(frame, '[data-testid="word-row"]')[0].dataset.id, 'w-beta');

  click(qa(frame, '[data-testid="level-filter"] .chip').find((c) => c.dataset.level === 'none'));
  await waitFor(() => qa(frame, '[data-testid="word-row"]').length === 2, { label: '筛出未标' });
  ok('点"未标"剩 2 个词', true);

  click(qa(frame, '[data-testid="level-filter"] .chip').find((c) => c.dataset.level === 'all'));
  await waitFor(() => qa(frame, '[data-testid="word-row"]').length === 4, { label: '回到全部' });
  eq('点"全部"恢复 4 个', qa(frame, '[data-testid="word-row"]').length, 4);

  // ---------------- 10. 长列表分批渲染（几百个词也不卡）----------------
  await db.wipeAll();
  const libBig = 'lib-big';
  await db.put('libs', { id: libBig, name: '大词库', color: '#3b5bff', order: 0, updatedAt: NOW });
  const bigRows = [];
  for (let i = 0; i < 134; i++) {
    bigRows.push({
      id: `w-big-${String(i).padStart(3, '0')}`,
      term: `word${String(i).padStart(3, '0')}`,
      termNorm: `word${i}`,
      phonetic: '', pos: '', meanings: [`意思${i}`], example: '', note: '',
      createdAt: NOW + i, updatedAt: NOW
    });
  }
  await db.putMany('words', bigRows);
  await db.putMany('links', bigRows.map((r) => ({ id: `${r.id}|${libBig}`, wordId: r.id, libId: libBig, addedAt: NOW, updatedAt: NOW })));

  frame = await openApp({ hash: `#/word?lib=${libBig}`, sel: '[data-testid="word-row"]' });
  eq('一次只渲染 60 行（不是一次建 134 个节点）', qa(frame, '[data-testid="word-row"]').length, 60);
  ok('底部给出"继续加载"', !!q(frame, '[data-testid="btn-list-more"]'));
  ok('提示还剩多少个', t(frame, '[data-testid="btn-list-more"]').includes('还有 74 个'), t(frame, '[data-testid="btn-list-more"]'));

  click(q(frame, '[data-testid="btn-list-more"]'));
  await waitFor(() => qa(frame, '[data-testid="word-row"]').length === 120, { label: '再加载 60 行' });
  click(q(frame, '[data-testid="btn-list-more"]'));
  await waitFor(() => qa(frame, '[data-testid="word-row"]').length === 134, { label: '加载完' });
  ok('加载完后"继续加载"自己消失', !q(frame, '[data-testid="btn-list-more"]'));

  type(q(frame, '[data-testid="word-search"]'), 'word12');
  await waitFor(() => qa(frame, '[data-testid="word-row"]').length > 0 && qa(frame, '[data-testid="word-row"]').length < 60, { label: '搜索结果' });
  const hits = qa(frame, '[data-testid="word-row"]').length;
  ok('搜索是在全部 134 个里搜（不只是已渲染的那些）', hits >= 10 && hits < 60, String(hits));
} catch (e) {
  ok('界面测试脚本本身不能崩', false, (e && e.stack) || String(e));
}

report();
release();
</script>
</body>
</html>
