<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>生疏/熟记专项（v23 内置于词库）· 界面测试</title>
</head>
<body>
<pre id="result">{"stage":"running"}</pre>
<script src="trap.js"></script>
<script type="module">
/* v23 起，生疏词/熟记词不再挂在首页，而是**内置于每个词库页**（总词库 = 全局）。
   测：
 *   - 词库页顶部有两块内置入口，数量实时算
 *   - 点 ▶ 直接进专项练习，只练这一档的词（不管到期没到期）
 *   - 练习里标「熟记」→ 数量跟着变
 *   - 首页不再有「自动收集」卡
 * 跑法：python tool/browser_test.py tests/browser/smart.test.html
 */
import { click, eq, holdLoad, ok, openApp, pressEnter, report, type, waitFor } from './harness.js';

const release = holdLoad();
const NOW = Date.now();
let db = null;

const q = (frame, sel) => frame.contentDocument.querySelector(sel);
const qa = (frame, sel) => [...frame.contentDocument.querySelectorAll(sel)];
const t = (frame, sel) => {
  const n = q(frame, sel);
  return n ? n.textContent.replace(/\s+/g, ' ').trim() : '';
};

/** 三个词：apply 和 research 标生疏（research 更晚），absorb 标熟记 */
async function seed() {
  await db.wipeAll();
  const lib = 'lib-a';
  await db.put('libs', { id: lib, name: '四级 Test 1', color: '#3b5bff', order: 0, updatedAt: NOW });
  const words = [
    ['apply', ['申请', '应用']],
    ['research', ['研究', '调查']],
    ['absorb', ['吸收']]
  ];
  let i = 0;
  for (const [term, meanings] of words) {
    const id = `w-${term}`;
    await db.put('words', { id, term, termNorm: term, phonetic: '', pos: '', meanings, example: '', note: '', createdAt: NOW + i++, updatedAt: NOW });
    await db.put('links', { id: `${id}|${lib}`, wordId: id, libId: lib, addedAt: NOW, updatedAt: NOW });
  }
  await db.put('prog', { wordId: 'w-apply', box: 1, dueAt: NOW + 60000, streak: 0, lapses: 0, lastDir: 'en2zh', level: 'unfamiliar', levelAt: NOW + 10, updatedAt: NOW });
  await db.put('prog', { wordId: 'w-research', box: 1, dueAt: NOW + 60000, streak: 0, lapses: 0, lastDir: 'en2zh', level: 'unfamiliar', levelAt: NOW + 20, updatedAt: NOW });
  await db.put('prog', { wordId: 'w-absorb', box: 6, dueAt: NOW + 60 * 86400000, streak: 3, lapses: 0, lastDir: 'en2zh', level: 'known', levelAt: NOW + 30, updatedAt: NOW });
  return lib;
}

/** 一个只属于第二个词库的词，用来验证"带 lib 的计数只算这个库" */
async function seedSecondLib() {
  const lib2 = 'lib-b';
  await db.put('libs', { id: lib2, name: '考研', color: '#ff9f0a', order: 1, updatedAt: NOW });
  await db.put('words', { id: 'w-only2', term: 'only2', termNorm: 'only2', phonetic: '', pos: '', meanings: ['只属于第二个库'], example: '', note: '', createdAt: NOW, updatedAt: NOW });
  await db.put('links', { id: 'w-only2|' + lib2, wordId: 'w-only2', libId: lib2, addedAt: NOW, updatedAt: NOW });
  await db.put('prog', { wordId: 'w-only2', box: 1, dueAt: NOW + 60000, streak: 0, lapses: 0, lastDir: 'en2zh', level: 'unfamiliar', levelAt: NOW + 50, updatedAt: NOW });
  return lib2;
}

async function emptyCase() {
  await db.wipeAll();
  const lib = 'lib-a';
  await db.put('libs', { id: lib, name: '四级 Test 1', color: '#3b5bff', order: 0, updatedAt: NOW });
  await db.put('words', { id: 'w-x', term: 'xenon', termNorm: 'xenon', phonetic: '', pos: '', meanings: ['氙'], example: '', note: '', createdAt: NOW, updatedAt: NOW });
  await db.put('links', { id: 'w-x|' + lib, wordId: 'w-x', libId: lib, addedAt: NOW, updatedAt: NOW });
  return lib;
}

try {
  db = await import('../../src/db.js');

  // ---------------- 1. 首页不再有「自动收集」卡 ----------------
  await emptyCase();
  const homeFrame = await openApp({ hash: '#/', sel: '[data-testid="all-lib-row"]' });
  ok('首页不再显示「自动收集」卡', !q(homeFrame, '[data-testid="smart-strip"]'), '还找得到 smart-strip');
  ok('首页也不再有任何 smart-row', qa(homeFrame, '[data-testid="smart-row"]').length === 0);

  // ---------------- 2. 词库页顶部内置两块入口，数量实时算 ----------------
  await seed();
  let frame = await openApp({ hash: '#/word?lib=lib-a', sel: '[data-testid="builtin-smart"]' });
  ok('词库页有内置块', !!q(frame, '[data-testid="builtin-smart"]'));
  ok('生疏词 2 个', t(frame, '[data-testid="builtin-count-unfamiliar"]').includes('2 个词'), t(frame, '[data-testid="builtin-count-unfamiliar"]'));
  ok('熟记词 1 个', t(frame, '[data-testid="builtin-count-known"]').includes('1 个词'), t(frame, '[data-testid="builtin-count-known"]'));

  // ---------------- 3. 点 ▶ 进专项练习，只练这一档 ----------------
  click(q(frame, '[data-testid="btn-practice-unfamiliar"]'));
  await waitFor(() => frame.contentWindow.location.hash.includes('level=unfamiliar'), { label: '进专项练习' });
  await waitFor(() => q(frame, '[data-testid="practice-prompt"]'), { label: '出现题目' });
  eq('专项练习只练这 2 个生疏词', t(frame, '[data-testid="progress-text"]'), '第 1/2');
  eq('最近标的排前面', t(frame, '[data-testid="practice-prompt"]'), 'research');
  ok('没到期的词也照样练', true);
  ok('默认是过一遍模式（生疏词不用默写）',
     q(frame, '[data-testid="practice-answer"]').hidden === false, '应该是过一遍');

  // ---------------- 4. 练习中标「熟记」→ 内置计数跟着变 ----------------
  click(q(frame, '[data-testid="btn-level-known"]'));
  await waitFor(async () => (await db.get('prog', 'w-research')).level === 'known', { label: '标成熟记' });
  frame.contentWindow.location.hash = '#/word?lib=lib-a';
  await waitFor(() => t(frame, '[data-testid="builtin-count-unfamiliar"]').includes('1 个词'), { label: '计数刷新成 1' });
  ok('标熟记后本库生疏词变 1', t(frame, '[data-testid="builtin-count-unfamiliar"]').includes('1 个词'));
  ok('熟记词变 2', t(frame, '[data-testid="builtin-count-known"]').includes('2 个词'), t(frame, '[data-testid="builtin-count-known"]'));

  // ---------------- 5. 点内置那一行 = 只看这批词（不是开练）----------------
  click(q(frame, '[data-testid="builtin-unfamiliar"] .lib-name'));
  await waitFor(() => qa(frame, '[data-testid="word-row"]').length === 1, { label: '列表筛到 1 个' });
  eq('筛出来的是 apply', qa(frame, '[data-testid="word-row"]')[0].dataset.id, 'w-apply');
  eq('URL 上也带上了 level', frame.contentWindow.location.hash.includes('level=unfamiliar'), true);

  // ---------------- 6. 带库的计数只算这个库 ----------------
  await seedSecondLib();
  const lib2Frame = await openApp({ hash: '#/word?lib=lib-b', sel: '[data-testid="builtin-smart"]' });
  ok('第二个库的生疏词是它自己的 1 个', t(lib2Frame, '[data-testid="builtin-count-unfamiliar"]').includes('1 个词'),
     t(lib2Frame, '[data-testid="builtin-count-unfamiliar"]'));

  const allFrame = await openApp({ hash: '#/word', sel: '[data-testid="builtin-smart"]' });
  ok('总词库的生疏词是全局的 2 个（apply + only2）', t(allFrame, '[data-testid="builtin-count-unfamiliar"]').includes('2 个词'),
     t(allFrame, '[data-testid="builtin-count-unfamiliar"]'));
  ok('总词库页标题是「全部词条」', t(allFrame, '.page-title').includes('全部词条'), t(allFrame, '.page-title'));

  // ---------------- 7. 智能库自己的页面不重复给内置块 ----------------
  const smartFrame = await openApp({ hash: '#/word?smart=smart%3Aunfamiliar', sel: '[data-testid="word-row"]' });
  eq('智能库页标题是智能库名字', t(smartFrame, '.page-title'), '生疏词');
  ok('智能库页不再重复显示内置块', !q(smartFrame, '[data-testid="builtin-smart"]'));
  eq('筛选条自动切到"生疏"', q(smartFrame, '[data-testid="level-filter"] .chip[data-level="unfamiliar"]').getAttribute('aria-pressed'), 'true');
} catch (e) {
  ok('生疏/熟记专项测试脚本本身不能崩', false, (e && e.stack) || String(e));
}

report();
release();
</script>
</body>
</html>
