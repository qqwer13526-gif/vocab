<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>练习界面 · 界面测试</title>
</head>
<body>
<pre id="result">{"stage":"running"}</pre>
<script src="trap.js"></script>
<script type="module">
/* 练习界面（任务 7）的界面测试：两个方向、判定、差点、写库、会话小结。
   跑法：python tool/browser_test.py tests/browser/ui-practice.test.html
*/
import { click, eq, holdLoad, ok, openApp, pressEnter, pressKey, report, type, wait, waitFor } from './harness.js';

const release = holdLoad();
const NOW = Date.now();
let db = null;

const W = [
  { id: 'w-absorb', term: 'absorb', pos: 'v.', meanings: ['take in or soak up吸收', '使专心'] },
  { id: 'w-run', term: 'run', pos: 'v.', meanings: ['跑', '经营'] },
  { id: 'w-book', term: 'book', pos: 'n.', meanings: ['书'] }
];
// 常用搭配（example 字段）：第二条是故意留的"多条 + 中文"，用来验证按分隔符拆行
const EXAMPLE = { 'w-absorb': 'be absorbed in 全神贯注于；absorb the impact 缓冲冲击' };

async function seed() {
  await db.wipeAll();
  const lib = 'lib-a';
  await db.put('libs', { id: lib, name: '四级 Test 1', color: '#3b5bff', order: 0, updatedAt: NOW });
  let i = 0;
  for (const w of W) {
    await db.put('words', { ...w, termNorm: w.term, phonetic: w.id === 'w-absorb' ? 'əbˈsɔːb' : '', example: EXAMPLE[w.id] || '', note: '', createdAt: NOW + i++, updatedAt: NOW });
    await db.put('links', { id: `${w.id}|${lib}`, wordId: w.id, libId: lib, addedAt: NOW, updatedAt: NOW });
  }
  return lib;
}

// iframe 内取元素的小助手
const q = (frame, sel) => frame.contentDocument.querySelector(sel);
const qa = (frame, sel) => [...frame.contentDocument.querySelectorAll(sel)];
const t = (frame, sel) => {
  const n = q(frame, sel);
  return n ? n.textContent.replace(/\s+/g, ' ').trim() : '';
};
const prog = (id) => db.get('prog', id);

try {
  db = await import('../../src/db.js');
  const lib = await seed();

  // ---------------- 1. 开局 ----------------
  let frame = await openApp({ hash: `#/practice?lib=${lib}&dir=en2zh`, sel: '[data-testid="practice-prompt"]' });
  eq('顶部显示进度', t(frame, '[data-testid="progress-text"]'), '第 1/3');
  eq('英→中：提示是英文单词', t(frame, '[data-testid="practice-prompt"]'), 'absorb');
  ok('英文方向显示音标/词性', t(frame, '[data-testid="practice-hint"]').includes('əbˈsɔːb'), t(frame, '[data-testid="practice-hint"]'));
  const input = q(frame, '[data-testid="practice-input"]');
  ok('有输入框且开了自动聚焦', !!input);
  eq('输入框关掉了自动补全和拼写检查', [input.getAttribute('autocomplete'), input.getAttribute('spellcheck')], ['off', 'false']);
  eq('输入框带 enterkeyhint', input.getAttribute('enterkeyhint'), 'done');
  ok('默写：答案先收起来（搭配里就含答案）', q(frame, '[data-testid="practice-answer"]').hidden === true);
  ok('默写：输入框聚焦时滑片先躲开（键盘会盖住它）', q(frame, '[data-testid="nav-slider"]').hidden === true);

  // ---------------- 2. 答对 ----------------
  type(input, '吸收');
  pressEnter(input);
  await waitFor(() => q(frame, '[data-testid="feedback"]:not([hidden])'), { label: '出现反馈' });
  eq('答对：反馈标成 true', q(frame, '[data-testid="feedback"]').dataset.ok, 'true');
  ok('答对后出现下一题按钮', !q(frame, '[data-testid="btn-next"]').hidden);
  ok('答对不显示正确答案', !t(frame, '[data-testid="feedback"]').includes('正确答案'), t(frame, '[data-testid="feedback"]'));
  ok('答完（焦点移到下一题）滑片回来', q(frame, '[data-testid="nav-slider"]').hidden === false);
  await waitFor(async () => (await prog('w-absorb'))?.box === 2, { label: '写库：盒子升到 2' });
  const p1 = await prog('w-absorb');
  eq('答对后盒子是 2、连对 1、方向记成 en2zh', [p1.box, p1.streak, p1.lastDir], [2, 1, 'en2zh']);
  ok('答对后下次复习推到 1 天后', p1.dueAt > NOW + 20 * 3600 * 1000, String(p1.dueAt - NOW));

  // ---------------- 3. 回车进下一题 + 答错 ----------------
  pressEnter(input);
  await waitFor(() => t(frame, '[data-testid="practice-prompt"]') === 'run', { label: '第二题' });
  eq('进度跟着走', t(frame, '[data-testid="progress-text"]'), '第 2/3');
  ok('换了题就清空输入框', q(frame, '[data-testid="practice-input"]').value === '');
  type(q(frame, '[data-testid="practice-input"]'), '走路');
  pressEnter(q(frame, '[data-testid="practice-input"]'));
  await waitFor(() => q(frame, '[data-testid="feedback"]')?.dataset.ok === 'false', { label: '判错' });
  ok('答错要给出正确答案（在下面的揭晓块里，不是挤在反馈行）', q(frame, '[data-testid="practice-answer"]').hidden === false
    && t(frame, '[data-testid="answer-means"]').includes('跑'), t(frame, '[data-testid="answer-means"]'));
  const p2 = await prog('w-run');
  eq('答错：回盒子 1、lapses 1、streak 0', [p2.box, p2.lapses, p2.streak], [1, 1, 0]);
  ok('答错后 10 分钟就该再见', p2.dueAt - NOW <= 11 * 60 * 1000 && p2.dueAt - NOW >= 9 * 60 * 1000, String(p2.dueAt - NOW));

  // ---------------- 4. 差点（英译中）→ 算我对 ----------------
  click(q(frame, '[data-testid="btn-next"]'));
  await waitFor(() => t(frame, '[data-testid="practice-prompt"]') === 'book', { label: '第三题' });
  type(q(frame, '[data-testid="practice-input"]'), '书');
  pressEnter(q(frame, '[data-testid="practice-input"]'));
  await waitFor(() => q(frame, '[data-testid="feedback"]')?.dataset.ok === 'true', { label: '第三题答对' });
  eq('最后一题时按钮变成"背完了"', t(frame, '[data-testid="btn-next"]'), '背完了');
  click(q(frame, '[data-testid="btn-next"]'));

  // ---------------- 5. 背完整个词库：报一句 + 回词库页（不再有成绩单/再来一轮）----------------
  await waitFor(() => (frame.contentWindow.location.hash || '').startsWith('#/word'), { label: '背完回词库页' });
  const doneToast = t(frame, '[data-testid="toast"]');
  ok('轻提示里报了练了几题', doneToast.includes('练完 3 题'), doneToast);
  ok('轻提示里有对错数', doneToast.includes('对 2') && doneToast.includes('错 1'), doneToast);
  await waitFor(() => t(frame, '#view-word').includes('四级 Test 1'), { label: '词库页渲染出这个库' });
  ok('回到了这个库的词库页', true);
  ok('不再有成绩单那张卡', q(frame, '[data-testid="session-summary"]') === null);
  ok('不再有"再来一轮"', q(frame, '[data-testid="btn-again"]') === null);

  // ---------------- 6. 中译英 + 差点 → 再试一次 ----------------
  await db.wipeAll();
  const lib2 = await seed();
  frame = await openApp({ hash: `#/practice?lib=${lib2}&dir=zh2en`, sel: '[data-testid="practice-prompt"]' });
  eq('中→英：提示是中文释义', t(frame, '[data-testid="practice-prompt"]').includes('吸收'), true);
  eq('题目里的中文也是一行一条', t(frame, '[data-testid="practice-prompt"] [data-testid="mean-zh"]'), '吸收');
  eq('题目里的英文原释义另起一行', t(frame, '[data-testid="practice-prompt"] [data-testid="mean-en"]'), 'take in or soak up');
  const inp2 = q(frame, '[data-testid="practice-input"]');
  type(inp2, 'absord');
  pressEnter(inp2);
  await waitFor(() => q(frame, '[data-testid="feedback"]')?.dataset.ok === 'retry', { label: '差点 → 再试一次' });
  ok('差点时提示再试一次', t(frame, '[data-testid="feedback"]').includes('再试'), t(frame, '[data-testid="feedback"]'));
  ok('差点不等于判错', t(frame, '[data-testid="feedback"]').includes('正确答案') === false, t(frame, '[data-testid="feedback"]'));
  ok('差点会清空输入框让人重打', q(frame, '[data-testid="practice-input"]').value === '');
  ok('差点时没有"下一题"按钮', q(frame, '[data-testid="btn-next"]').hidden);
  ok('没定论时先不揭晓（免得等于送答案）', q(frame, '[data-testid="practice-answer"]').hidden === true);
  eq('差点不写库', await prog('w-absorb'), undefined);
  eq('进度还停在第 1 题', t(frame, '[data-testid="progress-text"]'), '第 1/3');

  // 第二次打对 → 才算过
  type(q(frame, '[data-testid="practice-input"]'), 'absorb');
  pressEnter(q(frame, '[data-testid="practice-input"]'));
  await waitFor(() => q(frame, '[data-testid="feedback"]')?.dataset.ok === 'true', { label: '重打后判对' });
  await waitFor(async () => (await prog('w-absorb'))?.box === 2, { label: '重打后写库' });
  eq('重打对了才算这一题过', (await prog('w-absorb')).box, 2);
  eq('差点次数被记下来了', (await prog('w-absorb')).lastDir, 'zh2en');

  // ---------------- 6b. 默写答完：摊开全部释义 + 全部搭配 ----------------
  ok('答完自动摊开', q(frame, '[data-testid="practice-answer"]').hidden === false);
  eq('中→英方向补一行词头（原来只给中文，看不到那个英文词）', t(frame, '[data-testid="answer-word"]'), 'absorb');
  ok('释义一行一条（全部）', qa(frame, '[data-testid="answer-means"] .answer-row').length === 2
    && t(frame, '[data-testid="answer-means"]').includes('使专心'), t(frame, '[data-testid="answer-means"]'));
  ok('搭配按分隔符拆成两条', qa(frame, '[data-testid="practice-colloc"] .answer-row').length === 2, t(frame, '[data-testid="practice-colloc"]'));
  ok('搭配内容对得上', t(frame, '[data-testid="practice-colloc"]').includes('be absorbed in 全神贯注于'), t(frame, '[data-testid="practice-colloc"]'));

  // ---------------- 6c. 中文释义与英文原释义分栏 ----------------
  eq('中文单独一行', t(frame, '[data-testid="answer-means"] [data-testid="mean-zh"]'), '吸收');
  eq('英文原释义另一行（原来和中文粘在一行里）', t(frame, '[data-testid="answer-means"] [data-testid="mean-en"]'), 'take in or soak up');
  eq('只有中文的那条就不画英文行', qa(frame, '[data-testid="answer-means"] .answer-row')[1].querySelectorAll('[data-testid="mean-en"]').length, 0);

  // ---------------- 7. 英译中的"算我对" ----------------
  await db.wipeAll();
  const lib3 = await seed();
  frame = await openApp({ hash: `#/practice?lib=${lib3}&dir=en2zh`, sel: '[data-testid="practice-prompt"]' });
  type(q(frame, '[data-testid="practice-input"]'), '吸收');
  pressEnter(q(frame, '[data-testid="practice-input"]'));
  await waitFor(() => q(frame, '[data-testid="feedback"]')?.dataset.ok === 'true', { label: '第一个词答完' });
  // 走完 absorb 后到 run
  pressEnter(q(frame, '[data-testid="practice-input"]'));
  await waitFor(() => t(frame, '[data-testid="practice-prompt"]') === 'run', { label: '到 run' });
  const inp3 = q(frame, '[data-testid="practice-input"]');
  type(inp3, '跑不');
  pressEnter(inp3);
  await waitFor(() => q(frame, '[data-testid="feedback"]')?.dataset.ok === 'near', { label: '差点 → 由用户定夺' });
  ok('差点时给"算我对"按钮', !q(frame, '[data-testid="btn-force-ok"]').hidden);
  ok('差点时也摊开答案做参考（不再挤在反馈那行里）', q(frame, '[data-testid="practice-answer"]').hidden === false
    && t(frame, '[data-testid="answer-means"]').includes('跑'), t(frame, '[data-testid="answer-means"]'));
  click(q(frame, '[data-testid="btn-force-ok"]'));
  await waitFor(async () => (await prog('w-run'))?.box === 2, { label: '"算我对"按答对处理' });
  eq('"算我对"按答对写库', (await prog('w-run')).box, 2);

  // ---------------- 8. 方向切换 ----------------
  click(q(frame, '[data-testid="dir-switch"] [data-dir="zh2en"]'));
  await waitFor(() => q(frame, '[data-testid="dir-switch"] [data-dir="zh2en"]').getAttribute('aria-pressed') === 'true', { label: '方向切到中→英' });
  eq('切方向后 URL 也跟着变', frame.contentWindow.location.hash.includes('dir=zh2en'), true);

  // ---------------- 9. 退出 ----------------
  click(q(frame, '[data-testid="btn-quit"]'));
  await waitFor(() => frame.contentWindow.location.hash === '#/' || frame.contentWindow.location.hash === '', { label: '回到首页' });
  ok('点 ✕ 回首页', true);

  // ---------------- 10. 抽查时手动定级：熟记 / 生疏 ----------------
  await db.wipeAll();
  const lib4 = await seed();
  frame = await openApp({ hash: `#/practice?lib=${lib4}&dir=en2zh`, sel: '[data-testid="practice-prompt"]' });

  // 第一个词先正常答对（盒子变 2），再用"熟记"覆盖它
  type(q(frame, '[data-testid="practice-input"]'), '吸收');
  pressEnter(q(frame, '[data-testid="practice-input"]'));
  await waitFor(async () => (await prog('w-absorb'))?.box === 2, { label: '答对后盒子 2' });
  click(q(frame, '[data-testid="btn-level-known"]'));
  await waitFor(async () => (await prog('w-absorb'))?.level === 'known', { label: '标成熟记' });
  const pk = await prog('w-absorb');
  eq('熟记 → 手动判断覆盖答题结果，盒子变 6', pk.box, 6);
  ok('熟记 → 60 天后再见', pk.dueAt - Date.now() > 59 * 86400000, `${Math.round((pk.dueAt - Date.now()) / 86400000)} 天`);
  eq('熟记不算答错', pk.lapses, 0);
  eq('标完自动进下一题', t(frame, '[data-testid="practice-prompt"]'), 'run');

  // 第二个词直接标"生疏"（不答题）
  click(q(frame, '[data-testid="btn-level-unfamiliar"]'));
  await waitFor(async () => (await prog('w-run'))?.level === 'unfamiliar', { label: '标成生疏' });
  const pu = await prog('w-run');
  eq('生疏 → 回盒子 1', pu.box, 1);
  ok('生疏 → 10 分钟后再见', Math.abs(pu.dueAt - Date.now() - 10 * 60 * 1000) < 3000, `${Math.round((pu.dueAt - Date.now()) / 1000)} 秒`);
  eq('生疏也不算答错', pu.lapses, 0);
  eq('标完又进下一题', t(frame, '[data-testid="practice-prompt"]'), 'book');

  // 最后一个词正常答完 → 背完整库
  type(q(frame, '[data-testid="practice-input"]'), '书');
  pressEnter(q(frame, '[data-testid="practice-input"]'));
  await waitFor(() => t(frame, '[data-testid="btn-next"]') === '背完了', { label: '最后一题' });
  click(q(frame, '[data-testid="btn-next"]'));
  await waitFor(() => (frame.contentWindow.location.hash || '').startsWith('#/word'), { label: '背完回词库页' });
  const sum10 = t(frame, '[data-testid="toast"]');
  ok('轻提示算进了手动标记', sum10.includes('手动标了 2') && sum10.includes('熟记 1'), sum10);
  ok('轻提示分了熟记/生疏', sum10.includes('生疏 1'), sum10);

  // ---------------- 11. 「过一遍」模式（只看不考，专门用来刷生疏词）----------------
  await db.wipeAll();
  const lib5 = await seed();
  frame = await openApp({ hash: `#/practice?lib=${lib5}&mode=review`, sel: '[data-testid="practice-prompt"]' });

  ok('过一遍：不显示输入框', q(frame, '[data-testid="practice-input"]').hidden === true);
  ok('过一遍：答案直接摊开', q(frame, '[data-testid="practice-answer"]').hidden === false);
  eq('第一题是 absorb', t(frame, '[data-testid="practice-prompt"]'), 'absorb');
  ok('答案里能看到释义', t(frame, '[data-testid="practice-answer"]').includes('吸收'), t(frame, '[data-testid="practice-answer"]'));
  ok('过一遍：方向切换收起来（两边都看得见，方向没意义）', q(frame, '[data-testid="dir-switch"]').hidden === true);
  eq('过一遍：卡片里只剩 生疏 / 熟记 两颗药丸', qa(frame, '.level-row button').length, 2);
  ok('过一遍：卡片里不再有「下一个」按钮', q(frame, '[data-testid="btn-skip"]') === null);
  ok('过一遍：卡片里那行"60 天后再见"的说明也删了', q(frame, '.level-hint') === null);
  ok('过一遍：卡片下方有滑片', q(frame, '[data-testid="nav-slider"]').hidden === false);
  ok('过一遍：揭晓块里不再重复词头与音标（题目上已经有）',
    q(frame, '[data-testid="answer-term"]').hidden === true && qa(frame, '[data-testid="answer-word"]').length === 0);

  click(q(frame, '[data-testid="btn-level-known"]'));
  await waitFor(async () => (await prog('w-absorb'))?.level === 'known', { label: '过一遍时标熟记写库' });
  eq('标熟记后盒子进 6', (await prog('w-absorb')).box, 6);
  await waitFor(() => t(frame, '[data-testid="practice-prompt"]') === 'run', { label: '自动进下一个词' });

  click(q(frame, '[data-testid="btn-next-word"]'));
  await waitFor(() => t(frame, '[data-testid="practice-prompt"]') === 'book', { label: '跳到第三个词' });
  eq('"不标"就是不写库', await prog('w-book'), undefined);

  click(q(frame, '[data-testid="btn-level-unfamiliar"]'));
  await waitFor(() => (frame.contentWindow.location.hash || '').startsWith('#/word'), { label: '过完整库' });
  const sum11 = t(frame, '[data-testid="toast"]');
  ok('报成绩用"过了一遍"的口径', sum11.includes('过了一遍 3 个词'), sum11);
  ok('成绩里统计熟记/生疏/跳过', sum11.includes('熟记 1') && sum11.includes('生疏 1') && sum11.includes('跳过 1'), sum11);

  // 没有"再来一轮"了：想再练就自己回练习页（这里顺便验模式选项框）
  frame.contentWindow.location.hash = `#/practice?lib=${lib5}&mode=review`;
  await waitFor(() => q(frame, '[data-testid="practice-prompt"]'), { label: '重新进练习' });
  eq('模式选项框：过一遍被选中', q(frame, '[data-testid="btn-mode-review"]').getAttribute('aria-pressed'), 'true');
  click(q(frame, '[data-testid="btn-mode-quiz"]'));
  await waitFor(() => q(frame, '[data-testid="practice-input"]').hidden === false, { label: '切回默写' });
  eq('模式选项框：点在默写那格上就按下去', q(frame, '[data-testid="btn-mode-quiz"]').getAttribute('aria-pressed'), 'true');
  ok('切回默写：输入框回来了', q(frame, '[data-testid="practice-input"]').hidden === false);
  ok('切回默写：答案收起来了', q(frame, '[data-testid="practice-answer"]').hidden === true);
  ok('URL 记下了当前模式', frame.contentWindow.location.hash.includes('mode=quiz'), frame.contentWindow.location.hash);

  // ---------------- 12. 过一遍模式：左右滑动 = 生疏 / 熟记（手势驱动）----------------
  await db.wipeAll();
  const lib6 = await seed();
  frame = await openApp({ hash: `#/practice?lib=${lib6}&mode=review`, sel: '[data-testid="practice-prompt"]' });
  const cardEl = () => q(frame, '.prac-card');
  const pe = (type, x, y = 300) =>
    cardEl().dispatchEvent(new PointerEvent(type, { pointerId: 7, clientX: x, clientY: y, bubbles: true, cancelable: true, button: 0, isPrimary: true }));

  ok('过一遍模式显示"左滑右滑"的提示', q(frame, '[data-testid="swipe-tip"]') === null);
  eq('第一题是 absorb', t(frame, '[data-testid="practice-prompt"]'), 'absorb');

  // 拖一点点 → 跟手，但松手要弹回去、不算数
  pe('pointerdown', 200);
  pe('pointermove', 230);
  ok('拖动时卡片跟手', cardEl().style.transform.includes('translateX(30px)'), cardEl().style.transform);
  pe('pointerup', 230);
  await wait(320);
  eq('没滑够距离就回弹', cardEl().style.transform, '');
  eq('回弹不算数（没有写库）', await prog('w-absorb'), undefined);

  // 右滑 → 熟记
  pe('pointerdown', 150);
  pe('pointermove', 300);
  eq('右滑时浮出"熟记"', t(frame, '[data-testid="swipe-badge"]'), '熟记');
  pe('pointerup', 300);
  await waitFor(async () => (await prog('w-absorb'))?.level === 'known', { label: '右滑标成熟记' });
  eq('右滑 = 熟记（盒子进 6）', (await prog('w-absorb')).box, 6);
  await waitFor(() => t(frame, '[data-testid="practice-prompt"]') === 'run', { label: '滑完自动进下一个词' });

  // 左滑 → 生疏
  pe('pointerdown', 300);
  pe('pointermove', 140);
  eq('左滑时浮出"生疏"', t(frame, '[data-testid="swipe-badge"]'), '生疏');
  pe('pointerup', 140);
  await waitFor(async () => (await prog('w-run'))?.level === 'unfamiliar', { label: '左滑标成生疏' });
  eq('左滑 = 生疏（回盒子 1）', (await prog('w-run')).box, 1);

  // 默写模式不该有滑动（高频打字场景不要加手势）
  frame.contentWindow.location.hash = `#/practice?lib=${lib6}&mode=quiz`;

  await db.wipeAll();
  const libL = await seed();
  // absorb 设成"已到期"，这样普通队列里就有它 —— 用来验证"从 run 开始时它排在后面"
  await db.put('prog', { wordId: 'w-absorb', box: 1, dueAt: NOW - 1000, streak: 0, lapses: 0, lastDir: 'en2zh', level: 'unfamiliar', levelAt: NOW + 10, updatedAt: NOW });
  await db.put('prog', { wordId: 'w-run', box: 1, dueAt: NOW + 60000, streak: 0, lapses: 0, lastDir: 'en2zh', level: 'unfamiliar', levelAt: NOW + 20, updatedAt: NOW });
  await db.put('prog', { wordId: 'w-book', box: 6, dueAt: NOW + 60 * 86400000, streak: 3, lapses: 0, lastDir: 'en2zh', level: 'known', levelAt: NOW + 30, updatedAt: NOW });

  // (a) 只练本库生疏词，且最近标的排前面
  let lvFrame = await openApp({ hash: `#/practice?lib=${libL}&level=unfamiliar`, sel: '[data-testid="practice-prompt"]' });
  eq('生疏词专项只出这 2 个', t(lvFrame, '[data-testid="progress-text"]'), '第 1/2');
  eq('最近标的排前面', t(lvFrame, '[data-testid="practice-prompt"]'), 'run', t(lvFrame, '[data-testid="practice-prompt"]'));
  ok('默认过一遍模式（生疏词不用默写）', q(lvFrame, '[data-testid="practice-answer"]').hidden === false);

  // (b) 熟记词专项：只出熟记的那一个
  lvFrame = await openApp({ hash: `#/practice?lib=${libL}&level=known`, sel: '[data-testid="practice-prompt"]' });
  eq('熟记词专项只出 1 个', t(lvFrame, '[data-testid="progress-text"]'), '第 1/1');
  eq('出的正是熟记的那个', t(lvFrame, '[data-testid="practice-prompt"]'), 'book');

  // (c) 从任意词开始背：第一题就是那个词，后面的词还接着排
  let fromFrame = await openApp({ hash: `#/practice?lib=${libL}&from=w-run`, sel: '[data-testid="practice-prompt"]' });
  eq('从 w-run 开始 → 第一题就是 run', t(fromFrame, '[data-testid="practice-prompt"]'), 'run');
  ok('它后面还接着别的词', Number(t(fromFrame, '[data-testid="progress-text"]').match(/1\/(\d+)/)[1]) >= 2,
     t(fromFrame, '[data-testid="progress-text"]'));

  // (d) 指定的词不在队列里（已掌握、不到期）也要能从那开始
  fromFrame = await openApp({ hash: `#/practice?lib=${libL}&from=w-book`, sel: '[data-testid="practice-prompt"]' });
  eq('从已掌握的词开始 → 也被拉进来排第一', t(fromFrame, '[data-testid="practice-prompt"]'), 'book');
  // ---------------- 20. v24：练习页的「选词」列表；v26：它和模式切换都是"选项框" ----------------
  await db.wipeAll();
  const libP = await seed();
  const pickFrame = await openApp({ hash: `#/practice?lib=${libP}&mode=review`, sel: '[data-testid="practice-prompt"]' });
  const pickerOf = () => q(pickFrame, '[data-testid="word-picker"]');
  ok('「选词」做成了选项框（chip）', q(pickFrame, '[data-testid="btn-picker"]').classList.contains('chip-btn'));
  ok('「过一遍 / 默写」是选项框（两格、当前那格按下）',
    qa(pickFrame, '[data-testid="mode-switch"] button').length === 2
    && q(pickFrame, '[data-testid="btn-mode-review"]').getAttribute('aria-pressed') === 'true');
  ok('默认不展开选词列表', pickerOf().hidden === true);
  click(q(pickFrame, '[data-testid="btn-picker"]'));
  await waitFor(() => pickerOf().hidden === false, { label: '选词列表展开' });
  ok('展开期间顶栏吸顶（手指落在列表上滚列表时，「收起」不会被滚出屏幕）',
    q(pickFrame, '#view-practice').classList.contains('picker-open') === true
    && pickFrame.contentWindow.getComputedStyle(q(pickFrame, '.prac-top')).position === 'sticky',
    pickFrame.contentWindow.getComputedStyle(q(pickFrame, '.prac-top')).position);
  ok('展开期间整个列表钉在屏幕上（fixed，宽度跟着卡片走）',
    pickFrame.contentWindow.getComputedStyle(pickerOf()).position === 'fixed'
    && Math.abs(Math.round(pickerOf().getBoundingClientRect().width) - Math.round(q(pickFrame, '.prac-card').getBoundingClientRect().width)) <= 1,
    `${pickerOf().getBoundingClientRect().width} vs ${q(pickFrame, '.prac-card').getBoundingClientRect().width}`);
  ok('展开期间页面锁住不滚（列表自己在里面滚，两层滚动条不叠）', pickFrame.contentDocument.body.style.overflow === 'hidden');
  ok('顶栏高度与卡片的左右位置都量出来交给 CSS（窄屏换行、桌面居中都不会贴歪）',
    /^\d+px$/.test(q(pickFrame, '#view-practice').style.getPropertyValue('--prac-top-h'))
    && /^\d+px$/.test(q(pickFrame, '#view-practice').style.getPropertyValue('--prac-left')),
    q(pickFrame, '#view-practice').getAttribute('style'));
  const total = Number(t(pickFrame, '[data-testid="progress-text"]').match(/1\/(\d+)/)[1]);
  eq('列表行数 = 这一轮的词数', qa(pickFrame, '[data-testid="picker-row"]').length, total);
  eq('第一行就是当前题', qa(pickFrame, '[data-testid="picker-row"]')[0].dataset.cur, 'true');
  ok('列表里带着词', t(pickFrame, '[data-testid="picker-row"]').includes(t(pickFrame, '[data-testid="practice-prompt"]')),
     t(pickFrame, '[data-testid="picker-row"]'));

  // 打开后点「收起」要真的收起（这条路径以前没测过，真机上"收不回去"就是这里漏的）
  click(q(pickFrame, '[data-testid="btn-picker"]'));
  await waitFor(() => pickerOf().hidden === true, { label: '点收起 → 列表折叠' });
  eq('收起后按钮字样回到"选词"', t(pickFrame, '[data-testid="btn-picker"]'), '选词');
  ok('收起后不再吸顶、也不再钉着、页面解锁',
    q(pickFrame, '#view-practice').classList.contains('picker-open') === false
    && pickFrame.contentWindow.getComputedStyle(pickerOf()).position !== 'fixed'
    && pickFrame.contentDocument.body.style.overflow === '');
  click(q(pickFrame, '[data-testid="btn-picker"]'));
  await waitFor(() => pickerOf().hidden === false, { label: '再展开' });

  // 跳题：点第 2 行 → 进度变第 2/n，并且列表自动收起
  click(qa(pickFrame, '[data-testid="picker-row"]')[1]);
  await waitFor(() => t(pickFrame, '[data-testid="progress-text"]') === `第 2/${total}`, { label: '跳到第 2 题' });
  ok('跳过去之后列表自己收起（挑完就走）', pickerOf().hidden === true);
  eq('收起后按钮的 aria-expanded 跟着变', q(pickFrame, '[data-testid="btn-picker"]').getAttribute('aria-expanded'), 'false');
  eq('收起后按钮字样也回到"选词"', t(pickFrame, '[data-testid="btn-picker"]'), '选词');
  eq('当前行跟着换成第 2 行', qa(pickFrame, '[data-testid="picker-row"]')[1].dataset.cur, 'true');
  ok('跳题后「上一题」是灰的（历史清掉了）', q(pickFrame, '[data-testid="btn-back"]').disabled === true);

  // 答一题 → 重新展开列表就能看到那一行的结果（收起时不去白刷 DOM，展开那一刻刷新）
  click(q(pickFrame, '[data-testid="btn-level-known"]'));
  await waitFor(() => t(pickFrame, '[data-testid="progress-text"]') === `第 3/${total}`, { label: '标完自动进下一题' });
  click(q(pickFrame, '[data-testid="btn-picker"]'));
  await waitFor(() => pickerOf().hidden === false, { label: '再展开看结果' });
  eq('答过的词在列表里显示结果', qa(pickFrame, '[data-testid="picker-row"]')[1].textContent.includes('熟记'), true,
     qa(pickFrame, '[data-testid="picker-row"]')[1].textContent);
  eq('当前行跟着到第 3 行', qa(pickFrame, '[data-testid="picker-row"]')[2].dataset.cur, 'true');

  // ---------------- 21. v29：整个词库一次进队（没有"一轮 N 个"）+ 长释义可折叠 ----------------
  await db.wipeAll();
  const libBig = 'lib-big';
  await db.put('libs', { id: libBig, name: 'Unit 1 Mind the gap', color: '#3b5bff', order: 0, updatedAt: NOW });
  const longMean = 'a very long definition that keeps going and going so that the card gets really tall 很长的释义之一';
  for (let i = 1; i <= 12; i++) {
    const id = `w-big-${i}`;
    const words = i === 1
      // 第 1 个词：6 条长释义（卡片会很高，应该被折叠）
      ? [longMean, longMean, longMean, longMean, longMean, longMean]
      : i === 2 ? ['短释义'] : [`第 ${i} 个词的意思`];
    await db.put('words', {
      id, term: `word${i}`, termNorm: `word${i}`, phonetic: '', pos: 'n.',
      meanings: words, example: '', note: '', createdAt: NOW + i, updatedAt: NOW
    });
    await db.put('links', { id: `${id}|${libBig}`, wordId: id, libId: libBig, addedAt: NOW, updatedAt: NOW });
  }
  let bigFrame = await openApp({ hash: `#/practice?lib=${libBig}&mode=review`, sel: '[data-testid="practice-prompt"]' });
  eq('12 个词的库：一次全进队（以前只给 10 个）', t(bigFrame, '[data-testid="progress-text"]'), '第 1/12');

  // 长释义：默认收起 + 有「展开全部释义（6 条）」
  const means = () => q(bigFrame, '[data-testid="answer-body"]');
  const foldBtn = () => q(bigFrame, '[data-testid="btn-fold-means"]');
  ok('长注释默认收起（释义 + 搭配整体）', means().classList.contains('folded') === true, means().className);
  ok('收起时给了展开按钮', foldBtn().hidden === false && t(bigFrame, '[data-testid="btn-fold-means"]').includes('展开全部注释（6 条释义）'), t(bigFrame, '[data-testid="btn-fold-means"]'));
  eq('展开按钮的 aria-expanded=false', foldBtn().getAttribute('aria-expanded'), 'false');
  const foldedH = means().getBoundingClientRect().height;
  click(foldBtn());
  await waitFor(() => means().classList.contains('folded') === false, { label: '展开' });
  ok('展开后变高', means().getBoundingClientRect().height > foldedH + 20,
     `${Math.round(foldedH)} → ${Math.round(means().getBoundingClientRect().height)}`);
  eq('展开后按钮变"收起注释"', t(bigFrame, '[data-testid="btn-fold-means"]'), '收起注释');
  eq('展开后 aria-expanded=true', foldBtn().getAttribute('aria-expanded'), 'true');
  click(foldBtn());
  await waitFor(() => means().classList.contains('folded') === true, { label: '再收起' });

  // 折叠状态本轮内记住：展开过一次，下一张长释义卡默认也是展开的
  click(foldBtn());
  await waitFor(() => means().classList.contains('folded') === false, { label: '展开（记住）' });
  pressKey(q(bigFrame, '.prac-card'), 'ArrowRight');
  await waitFor(() => t(bigFrame, '[data-testid="practice-prompt"]') === 'word2', { label: '到第 2 个词' });
  ok('短注释的词不折叠、也没有展开按钮', means().classList.contains('folded') === false && foldBtn().hidden === true);
} catch (e) {
  ok('界面测试脚本本身不能崩', false, (e && e.stack) || String(e));
}

report();
release();
</script>
</body>
</html>
