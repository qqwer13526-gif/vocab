<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<!-- 状态栏颜色要分深浅两套：只给一个值会导致深色模式下顶出一条白边 -->
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1012">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="背单词">
<meta name="description" content="自己的词表，两个方向手打练习，按遗忘曲线自动排复习">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>背单词</title>
<link rel="stylesheet" href="style.css">
<!-- 首屏模块并行预取（v30）：不然 "app.js → 它的 import → 它们的 import" 是一层层的瀑布，
     国内到 GitHub Pages 每层 ~400ms。这里只列首屏真要用的那几个（其余界面改成按需 import）。 -->
<link rel="modulepreload" href="src/app.js">
<link rel="modulepreload" href="src/ui-home.js">
<link rel="modulepreload" href="src/store.js">
<link rel="modulepreload" href="src/db.js">
<link rel="modulepreload" href="src/srs.js">
<link rel="modulepreload" href="src/judge.js">
<link rel="modulepreload" href="src/smart.js">
<link rel="modulepreload" href="src/icons.js">
<link rel="modulepreload" href="src/version.js">
<link rel="modulepreload" href="src/viewport.js">
<link rel="modulepreload" href="src/toast.js">
<!-- 首屏骨架：**内联**（不等 style.css、不等任何 JS），一进页面就有东西看，
     不然冷启动那几秒是纯白屏。放在 #app 里（各 view 这时都还是 hidden），app.js 渲染完第一屏就删掉。 -->
<style>
  #boot-skeleton .sk-block { background: #fff; border: 1px solid #ececf0; border-radius: 16px; padding: 18px 16px; }
  #boot-skeleton .sk-line { height: 14px; border-radius: 7px; background: #ececf0; margin: 0 0 10px; animation: sk-pulse 1.4s ease-in-out infinite; }
  #boot-skeleton .sk-line.w40 { width: 40%; }
  #boot-skeleton .sk-line.w70 { width: 70%; }
  #boot-skeleton .sk-card { height: 92px; border-radius: 16px; background: #fff; border: 1px solid #ececf0; margin-top: 12px; animation: sk-pulse 1.4s ease-in-out infinite; }
  #boot-skeleton .sk-tip { text-align: center; color: #666c76; font-size: 13px; margin-top: 14px; }
  @keyframes sk-pulse { 0%, 100% { opacity: 1 } 50% { opacity: .55 } }
  @media (prefers-color-scheme: dark) {
    #boot-skeleton .sk-block, #boot-skeleton .sk-card { background: #1c1c1e; border-color: #2c2c2e; }
    #boot-skeleton .sk-line { background: #2c2c2e; }
    #boot-skeleton .sk-tip { color: #9a9aa0; }
  }
  @media (prefers-reduced-motion: reduce) { #boot-skeleton .sk-line, #boot-skeleton .sk-card { animation: none } }
</style>
</head>
<body>
<div id="update-bar" class="update-bar" data-testid="update-banner" hidden>
  <span>有新版本了，更新后数据不会丢</span>
  <button type="button" data-testid="btn-update">立即更新</button>
</div>
<main id="app">
  <section id="view-home"     class="view" hidden></section>
  <section id="view-practice" class="view" hidden></section>
  <section id="view-import"   class="view" hidden></section>
  <section id="view-word"     class="view" hidden></section>
  <section id="view-settings" class="view" hidden></section>
  <div id="boot-skeleton" aria-hidden="true" data-testid="boot-skeleton">
    <div class="sk-block">
      <div class="sk-line w40"></div>
      <div class="sk-line w70"></div>
      <div class="sk-line"></div>
    </div>
    <div class="sk-card"></div>
    <div class="sk-card"></div>
    <p class="sk-tip">正在打开词库…</p>
  </div>
</main>
<nav id="tabbar" aria-label="主导航">
  <span class="nav-pill" aria-hidden="true"></span>
  <a href="#/"          data-nav="home"     data-testid="tab-home">词库</a>
  <a href="#/import"    data-nav="import"   data-testid="tab-import">导入</a>
  <a href="#/settings"  data-nav="settings" data-testid="tab-settings">设置</a>
</nav>
<p id="boot-error" hidden>这个应用需要 JavaScript 才能运行。</p>
<script type="module" src="src/app.js"></script>
</body>
</html>
